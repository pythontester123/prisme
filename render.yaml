# Déploiement sur Render (render.com → New → Blueprint)
# Offre gratuite : le site s'endort après 15 min sans visite et dispose de 512 Mo de mémoire.
# Les réglages ci-dessous évitent de saturer cette petite machine.
services:
  - type: web
    name: prisme
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MAX_FILE_MB
        value: "500"
      - key: MAX_PARALLEL
        value: "1"
      - key: MAX_QUEUE
        value: "10"
      - key: JOB_TIMEOUT_MIN
        value: "30"
      - key: SEVENZ_DICT_MB
        value: "16"
      - key: FILE_TTL_MIN
        value: "60"
