<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Prisme</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 28.5 27h-25z' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="convert">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m21 15.5-4.6-4.6a1.2 1.2 0 0 0-1.7 0L7 18.6"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.2 9.4v5.2l4.4-2.6z" fill="currentColor"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10.5v3M8 7.5v9M12 4.5v15M16 8.5v7M20 10.5v3"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h6.6L19 8.4V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M13.5 3v5.5H19M8.5 13h7M8.5 16.5h5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 10h18M3 15h18M9.5 10v10"/></symbol>
    <symbol id="i-braces" viewBox="0 0 24 24"><path d="M8.5 4C6.5 4 6 5 6 7v2.2c0 1.4-.8 2.3-2 2.8 1.2.5 2 1.4 2 2.8V17c0 2 .5 3 2.5 3M15.5 4c2 0 2.5 1 2.5 3v2.2c0 1.4.8 2.3 2 2.8-1.2.5-2 1.4-2 2.8V17c0 2-.5 3-2.5 3"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.8"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h6.6L19 8.4V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M13.5 3v5.5H19"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11.5M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path class="draw" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></symbol>
    <symbol id="i-convert" viewBox="0 0 24 24"><path d="M4 9.5A8 8 0 0 1 18.2 6.3L20 8M20 3.5V8h-4.5M20 14.5a8 8 0 0 1-14.2 3.2L4 16M4 20.5V16h4.5"/></symbol>
    <symbol id="i-compress" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l6.5-6.5M10 14l-6.5 6.5"/></symbol>
    <symbol id="i-tray" viewBox="0 0 24 24"><path d="M12 3.5v9M8.5 9 12 12.5 15.5 9"/><path d="M3.5 14.5h4.2l1.6 2.6h5.4l1.6-2.6h4.2"/><path d="M3.5 14.5V18a2.5 2.5 0 0 0 2.5 2.5h12a2.5 2.5 0 0 0 2.5-2.5v-3.5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7zM19 16c.3 1.8 1.2 2.7 3 3-1.8.3-2.7 1.2-3 3-.3-1.8-1.2-2.7-3-3 1.8-.3 2.7-1.2 3-3z"/></symbol>
  </svg>

  <header class="toolbar glass">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 28.5 27h-25z" fill="currentColor"/></svg>
      <span>Prisme</span>
    </div>
    <nav class="seg" id="modeSeg" role="tablist" aria-label="Mode">
      <span class="thumb" aria-hidden="true"></span>
      <button role="tab" data-mode="convert" aria-selected="true"><svg class="ic"><use href="#i-convert"/></svg><span>Convertir</span></button>
      <button role="tab" data-mode="compress" aria-selected="false"><svg class="ic"><use href="#i-compress"/></svg><span>Compresser</span></button>
      <button role="tab" data-mode="archive" aria-selected="false"><svg class="ic"><use href="#i-box"/></svg><span>Archiver</span></button>
    </nav>
    <button class="btn ghost round" id="formatsBtn" aria-label="Formats pris en charge" title="Formats pris en charge"><svg class="ic"><use href="#i-info"/></svg></button>
  </header>

  <main>
    <section class="hero">
      <h1 id="modeTitle">Convertir</h1>
      <p id="modeSub">Change le format de n’importe quel fichier.</p>
    </section>

    <section class="options" id="options"></section>

    <section class="drop glass" id="drop">
      <input type="file" id="picker" multiple hidden>
      <div class="drop-icon glass"><svg class="ic"><use href="#i-tray"/></svg></div>
      <h2>Dépose tes fichiers ici</h2>
      <p>Images, vidéos, audio, documents, tableurs, archives… tout passe.</p>
      <button class="btn primary" id="pickBtn">Choisir des fichiers</button>
    </section>

    <section class="list" id="list" aria-live="polite"></section>
    <section id="archiveResult"></section>

    <p class="foot" id="foot"></p>
  </main>

  <div class="actionbar glass" id="actionbar">
    <span class="summary" id="summary"></span>
    <button class="btn ghost" id="clearBtn">Vider</button>
    <a class="btn" id="downloadAll" hidden><svg class="ic"><use href="#i-down"/></svg><span>Tout télécharger</span></a>
    <button class="btn primary" id="runBtn">Convertir</button>
  </div>

  <div class="popover glass" id="popover" role="menu" hidden></div>
  <div class="dragveil" id="dragveil" aria-hidden="true"><div class="glass"><svg class="ic"><use href="#i-tray"/></svg>Lâche pour ajouter</div></div>

  <dialog class="sheet glass" id="formatsSheet">
    <header>
      <h2>Formats pris en charge</h2>
      <button class="btn ghost round" id="closeSheet" aria-label="Fermer"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div id="formatsBody"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
